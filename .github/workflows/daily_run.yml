name: Strategy Intraday Monitor

on:
  schedule:
    # 盤中監控：
    # GitHub 使用 UTC
    # 台灣時間 21:00 ~ 04:45（週一至週五）
    # 每 15 分鐘執行一次
    - cron: '*/15 13-20 * * 1-5'

    # 每日晨報：
    # UTC 01:00 = 台灣時間 09:00
    - cron: '0 1 * * *'

  # GitHub Actions 手動執行
  workflow_dispatch:

jobs:
  check-strategy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 根據觸發事件與時間，判定執行模式並執行 Main.py
      # ==========================================
      - name: Run Main.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🧪 手動執行：python Main.py --manual"
            python Main.py --manual
          elif [ "${{ github.event.schedule }}" = "0 1 * * *" ]; then
            echo "🌅 每日晨報時間（台灣 09:00）：python Main.py --daily"
            python Main.py --daily
          else
            echo "⏰ 盤中監控：python Main.py"
            python Main.py
          fi
